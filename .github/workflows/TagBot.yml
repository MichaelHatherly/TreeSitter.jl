name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@40702a3965563953ad1ee7cf0fd5705a9f1c9811 # v1.26.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}